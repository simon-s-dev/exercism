name: Auto-Merge Exercism Solutions
on:
  pull_request_target:
    types: [opened]

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'exercism-solutions-syncer[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR and forcibly delete head branch
        run: |
          # Direct merge (bypasses --auto queue issue)
          gh pr merge "$PR_URL" --merge

          # Brief pause for GitHub to register the merged state
          sleep 2

          # Forcefully delete the remote branch via API
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH_NAME"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
