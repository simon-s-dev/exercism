name: Auto-Merge Exercism Solutions
on:
  pull_request_target:
    types: [opened]

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'exercism-solutions-syncer[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge with retry
        run: |
          for i in {1..5}; do
            gh pr merge "$PR_URL" --auto --merge --delete-branch && exit 0
            echo "Attempt $i failed due to API error/delay. Retrying in 5 seconds..."
            sleep 5
          done
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
